[project]
name = "keyward-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14",
    "anthropic>=0.70",
    "fastapi>=0.115",
    "httpx>=0.28",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
