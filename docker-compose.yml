services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keyward
      POSTGRES_USER: keyward
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./setup.sh first}
    ports:
      - "127.0.0.1:${DB_PORT:-5438}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyward -d keyward"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 覆核 API
  api:
    build: ./api
    command: ["sh", "start-api.sh"]
    environment:
      DATABASE_URL: postgresql+psycopg://keyward:${POSTGRES_PASSWORD}@db:5432/keyward
      JWT_SECRET: ${JWT_SECRET:?run ./setup.sh first}
      AUTH_MODE: ${AUTH_MODE:?run ./setup.sh first}
      DATA_DIR: /data
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # 同步與執行：連同一個 compose 裡的 mock
      KEYWARD_SOURCE: mock
      MOCK_URL: http://mock:8000
      MOCK_GRAPH_READER_ID: ${MOCK_GRAPH_READER_ID}
      MOCK_GRAPH_READER_SECRET: ${MOCK_GRAPH_READER_SECRET}
      MOCK_GRAPH_WRITER_ID: ${MOCK_GRAPH_WRITER_ID}
      MOCK_GRAPH_WRITER_SECRET: ${MOCK_GRAPH_WRITER_SECRET}
      MOCK_GITHUB_READ_TOKEN: ${MOCK_GITHUB_READ_TOKEN}
      MOCK_GITHUB_ADMIN_TOKEN: ${MOCK_GITHUB_ADMIN_TOKEN}
      # 選用：AI 規則提案。沒設定就停用 AI 功能，其他功能照常
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 接本機的 Ollama 時需要
    ports:
      - "127.0.0.1:${API_PORT:-8390}:8000"
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      mock:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3500}:3000"
    depends_on:
      - api

  # Graph 與 GitHub 的 mock：離線示範與評測用。只綁本機，不對外開放
  mock:
    build: ./api
    environment:
      DATA_DIR: /data
      MOCK_GRAPH_READER_ID: ${MOCK_GRAPH_READER_ID:?run ./setup.sh first}
      MOCK_GRAPH_READER_SECRET: ${MOCK_GRAPH_READER_SECRET:?run ./setup.sh first}
      MOCK_GRAPH_WRITER_ID: ${MOCK_GRAPH_WRITER_ID:?run ./setup.sh first}
      MOCK_GRAPH_WRITER_SECRET: ${MOCK_GRAPH_WRITER_SECRET:?run ./setup.sh first}
      MOCK_GITHUB_READ_TOKEN: ${MOCK_GITHUB_READ_TOKEN:?run ./setup.sh first}
      MOCK_GITHUB_ADMIN_TOKEN: ${MOCK_GITHUB_ADMIN_TOKEN:?run ./setup.sh first}
    ports:
      - "127.0.0.1:${MOCK_PORT:-8391}:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  # 假信箱：所有通知信都進這裡，不會到達任何真實信箱。網頁介面 http://localhost:8027
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8027}:8025"
      - "127.0.0.1:${MAIL_SMTP_PORT:-1027}:1025"  # 只給「不用 Docker 跑 API」的開發方式用

volumes:
  pgdata:
